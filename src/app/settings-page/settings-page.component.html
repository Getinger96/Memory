<section class="Settings-page">
    <section class="Setting-page__left__header">
        <h1>Settings</h1>
        <img src="./assets/img/head_line.png" alt="">
    </section>
    <section class="Settings-page__left">



        <section class="settings-page__settings">
            <section class="settings-page__settings__header">
                <img src="./assets/img/palette.png" alt="">
                <h2>Game themes</h2>
            </section>
            <section class="settings-page__settings__choose">
                <label>
                    <input type="radio" name="theme" value="code">
                    Code vibes theme
                </label>

                <label>
                    <input type="radio" name="theme" value="Gaming">
                    Gaming theme
                </label>

                <label>
                    <input type="radio" name="theme" value="DA">
                    DA Projects theme
                </label>

                <label>
                    <input type="radio" name="theme" value="Foods">
                    Foods theme
                </label>
            </section>

        </section>
        <section class="settings-page__settings">
            <section class="settings-page__settings__header">
                <img src="./assets/img/chess_pawn.png" alt="">
                <h2>Choose player</h2>
            </section>

            <section class="settings-page__settings__choose">
                <label>
                    <input type="radio" name="player" value="Blue-player">
                    Blue
                </label>

                <label>
                    <input type="radio" name="player" value="Orange-player">
                    Orange
                </label>
            </section>




        </section>
        <section class="settings-page__settings">

            <section class="settings-page__settings__header">
                <img src="./assets/img/style.png" alt="">
                <h2>Board size</h2>

            </section>

            <section class="settings-page__settings__choose">
                <label>
                    <input type="radio" name="size" value="16">
                    16 cards
                </label>

                <label>
                    <input type="radio" name="size" value="24">
                    24 cards
                </label>

                <label>
                    <input type="radio" name="size" value="36">
                    36 cards
                </label>
            </section>




        </section>


    </section>
    <section class="Settings-page__right">
        <img src="./assets/img/Frame 629.png" alt="">
        <section class="Settings-page__right__progress">
            <p>Game theme</p>
            <img src="./assets/img/Line 6.png" alt="">
            <p>Player</p>
            <img src="./assets/img/Line 6.png" alt="">
            <p>Board size</p>
            <button type="button" disabled><img src="./assets/img/smart_display.png" alt=""> Start</button>
        </section>
    </section>

</section>

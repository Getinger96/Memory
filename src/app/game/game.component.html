<section [class]="'game-body-section theme-' + folder">

    <header class="game__header">
        <section class="game__scores">
            <span class="score score--orange">
                <img [src]="path + '/player-orange.png'" alt="">
                {{ orangeScore }}
            </span>
            <span class="score score--blue">
                <img [src]="path + '/player-blue.png'" alt="">
                {{ blueScore }}
            </span>
        </section>

        <p class="game__current">
            Current player:
            <img [src]="path + '/player-' + currentPlayer + '.png'" alt="">
        </p>

        <button type="button" class="game__exit" (click)="exit()">
            <img [src]="path + '/exit.png'" alt=""> Exit game
        </button>
    </header>

    <section class="game-section" [style.grid-template-columns]="'repeat(' + columns + ', var(--card-w))'">
        @for (card of cards; track card.id) {
        <div class="card" [class.flipped]="card.flipped || card.matched" (click)="flip(card)">
            <img class="card__front" [src]="card.image" alt="" />
            <img class="card__back" [src]="path + '/card-back.png'" alt="" />
        </div>
        }
    </section>

</section>

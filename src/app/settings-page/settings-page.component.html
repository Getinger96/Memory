<section class="Settings-page">
    <section class="Setting-page__header">
        <h1>Settings</h1>
        <img src="./assets/img/head_line.png" alt="">
    </section>

    <section class="Settings-page__left">
        <section class="settings-page__settings">
            <img src="./assets/img/palette.png" alt="">
            <h2>Game themes</h2>

            <label>
                <input type="radio" name="theme" value="forest">
                Forest
            </label>

            <label>
                <input type="radio" name="theme" value="desert">
                Desert
            </label>

            <label>
                <input type="radio" name="theme" value="ocean">
                Ocean
            </label>

            <label>
                <input type="radio" name="theme" value="space">
                Space
            </label>
        </section>
        <section>
            <img src="./assets/img/chess_pawn.png" alt="">
            <h2>Choose player</h2>

            <label>
                <input type="radio" name="player" value="Blue-player">
                Blue
            </label>

            <label>
                <input type="radio" name="player" value="Orange-player">
                Orange
            </label>

        </section>
        <section>
            <img src="./assets/img/style.png" alt="">
            <h2>Board size</h2>

            <label>
                <input type="radio" name="size" value="16">
                16 cards
            </label>

            <label>
                <input type="radio" name="size" value="24">
                24 cards
            </label>

            <label>
                <input type="radio" name="size" value="36">
                36 cards
            </label>


        </section>


    </section>
    <section class="Settings-page__right">
        <img src="" alt="">
        <section>
            <p></p>
            <img src="" alt="">
            <p></p>
            <img src="" alt="">
            <p></p>
            <button><img src="./assets/img/smart_display.png" alt=""> Start</button>
        </section>
    </section>

</section>

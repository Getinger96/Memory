<section class="Settings-page">
    <section class="Setting-page__left__header">
        <h1>Settings</h1>
        <img src="./assets/img/head_line.png" alt="">
    </section>
    <section class="Settings-page__left">



        <section class="settings-page__settings">
            <section class="settings-page__settings__header">
                <img src="./assets/img/palette.png" alt="">
                <h2>Game themes</h2>
            </section>
            <section class="settings-page__settings__choose">
                <label>
                    <input type="radio" name="theme" value="Code vibes" (change)="theme='Code vibes'">
                    Code vibes theme
                </label>

                <label>
                    <input type="radio" name="theme" value="Gaming" (change)="theme = 'Gaming'">
                    Gaming theme
                </label>

                <label>
                    <input type="radio" name="theme" value="DA" (change)="theme = 'DA Projects theme'">
                    DA Projects theme
                </label>

                <label>
                    <input type="radio" name="theme" value="Foods" (change)="theme = 'Foods theme'">
                    Foods theme
                </label>
            </section>

        </section>
        <section class="settings-page__settings">
            <section class="settings-page__settings__header">
                <img src="./assets/img/chess_pawn.png" alt="">
                <h2>Choose player</h2>
            </section>

            <section class="settings-page__settings__choose">
                <label>
                    <input type="radio" name="player" value="Blue-player" (change)="player = 'Blue Player'">
                    Blue
                </label>

                <label>
                    <input type="radio" name="player" value="Orange-player" (change)="player = 'Orange Player'">
                    Orange
                </label>
            </section>




        </section>
        <section class="settings-page__settings">

            <section class="settings-page__settings__header">
                <img src="./assets/img/style.png" alt="">
                <h2>Board size</h2>

            </section>

            <section class="settings-page__settings__choose">
                <label>
                    <input type="radio" name="size" value="16" (change)="size = '16'">
                    16 cards
                </label>

                <label>
                    <input type="radio" name="size" value="24" (change)="size = '24'">
                    24 cards
                </label>

                <label>
                    <input type="radio" name="size" value="36" (change)="size = '36'">
                    36 cards
                </label>
            </section>




        </section>


    </section>
    <section class="Settings-page__right">
        <img [src]="themeFrames[theme] || './assets/img/Frame 629.png'" alt="">
        <section class="Settings-page__right__progress">
            <p>{{ theme || 'Theme' }}</p>
            <img [src]="theme ? './assets/img/Line 7.png' : './assets/img/Line 6.png'" alt="">
            <p>{{ player || 'Player' }}</p>
            <img [src]="player ? './assets/img/Line 7.png' : './assets/img/Line 6.png'" alt="">
            <p>{{ size ? size + ' cards' : 'Board size' }}</p>
            <button (click)="start()" type="button" [disabled]="!theme || !player || !size"><img
                    src="./assets/img/smart_display.png" alt=""> Start</button>
        </section>

    </section>


</section>
